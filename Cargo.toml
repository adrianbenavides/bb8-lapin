[package]
name = "bb8-lapin"
version = "0.8.0"
authors = ["Adrian Benavides <adri.benavides312@gmail.com>"]
repository = "https://github.com/adrianbenavides/bb8-lapin"
description = "r2d2-lapin, but for async tokio based connections"
license = "MIT"
edition = "2021"

[dependencies]
async-rs = { version = "^0.8.0", default-features = false }
bb8 = "~0.9.1"
lapin = "~4.1.0"

[dev-dependencies]
lazy_static = "1.5.0"
tokio = { version = "1.50.0", features = ["macros"] }
tokio-test = "0.4.5"
